{% extends "base.html" %}

{% block title %}Yönetici Girişi - EMLAKMATCH{% endblock %}

{% block bottom_nav %}{% endblock %}

{% block content %}
<div class="flex flex-col justify-between min-h-[85vh] py-4 max-w-md mx-auto">
    <!-- Üst Başlık -->
    <div class="flex flex-col items-center text-center mt-6">
        <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl flex items-center justify-center border border-slate-800 shadow-md mb-3">
            <span class="text-2xl">🛡️</span>
        </div>
        <h1 class="text-xl font-black text-slate-900 tracking-tight">Yönetim Konsolu</h1>
        <p class="text-xs text-slate-500 mt-1">Platform Admin Yetkili Girişi</p>
    </div>

    <!-- Form -->
    <div class="space-y-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
        {% if error %}
        <div class="p-2.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold rounded-xl text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="space-y-3">
            <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Yönetici E-Posta</label>
                <input type="email" name="eposta" required placeholder="admin@emlakmatch.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900 focus:bg-white focus:outline-none transition">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Yönetici Şifresi</label>
                <input type="password" name="sifre" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900 focus:bg-white focus:outline-none transition">
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-xl text-sm transition shadow-sm active:scale-[0.99] mt-2">
                Konsola Giriş Yap
            </button>
        </form>
    </div>

    <div class="text-center pt-2">
        <a href="/login" class="text-xs font-semibold text-slate-400 hover:text-slate-700">
            ← Emlakçı Girişine Dön
        </a>
    </div>
</div>
{% endblock %}
